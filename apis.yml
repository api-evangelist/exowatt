aid: exowatt
name: Exowatt
description: >-
  Exowatt is a clean-energy technology company redefining power generation for the AI era. Its
  flagship Exowatt P3 is a modular, dispatchable solar-thermal energy platform that captures solar
  energy with proprietary Fresnel lenses and heat exchangers, stores it in a high-efficiency heat
  battery, and dispatches electricity on demand via a proprietary heat engine, delivering up to 24
  hours of dispatchable baseload power. The systems are factory-built in the USA from abundant,
  low-cost materials without rare-earth minerals, and are aimed at energy-intensive customers such
  as AI data centers and utilities. Backed by a16z and Felicis, Exowatt is added to the API
  Evangelist network as a company profile; it currently publishes no public developer API or
  documentation surface.
